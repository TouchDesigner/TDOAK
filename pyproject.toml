[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TDOAK"
license-files = ["LICENSE"]
dynamic = ["version"]
description = "TouchDesigner OAK (Luxonis depthai v3) camera integration"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["touchdesigner", "oak", "depthai", "luxonis", "camera", "derivative"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
# depthai is pinned to the minor series that went through the hardware checklist: 3.x minors
# have shipped device-firmware and API regressions. Widen the range (and TESTED_DEPTHAI in
# src/TDOAK/core/compat.py — a test keeps the two in step) after testing a new series.
dependencies = [
  "depthai>=3.12,<3.13",
  "depthai-nodes>=0.8,<0.9",  # ParsingNeuralNetwork + parsers for Model Zoo NNs (pose_pipeline)
  "numpy",                    # TouchDesigner supplies its own numpy at runtime
]

[project.urls]
Repository = "https://github.com/TouchDesigner/TDOAK"
Issues = "https://github.com/TouchDesigner/TDOAK/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "TDOAK.__version__"}

[tool.setuptools.package-data]
TDOAK = [
  "*.tox",
  "examples/*",
  "examples/**/*",
  "assets/*",
  "assets/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "__pycache__/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["TDOAK*"]
exclude = [
  "TDOAK.examples", "TDOAK.examples.*",
  "*.__pycache__", "*.__pycache__.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.touchdesigner]
requiresTouchDesigner = "2025.33070"

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.1"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.11"
autoSetup = true
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src"]
