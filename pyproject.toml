[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TDOAK"
version = "0.1.0"
description = "TouchDesigner OAK camera integration"
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "depthai>=3.6.1",
    "depthai-nodes",  # ParsingNeuralNetwork + parsers for Model Zoo NNs (pose_pipeline)
    "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.1"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.12"
autoSetup = true
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src"]
